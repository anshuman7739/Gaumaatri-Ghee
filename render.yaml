services:
  - type: web
    name: gaumaatri-ghee
    runtime: node
    rootDir: .
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: NODE_ENV
        value: production
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: SHEETS_API_URL
        sync: false
      - key: SHEETS_API_TOKEN
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: ORDER_STORE_URL
        sync: false
      - key: ORDER_STORE_SECRET
        sync: false
      - key: EMAILJS_ACCESS_TOKEN
        sync: false
      - key: EMAILJS_SERVICE_ID
        sync: false
      - key: EMAILJS_USER_ID
        sync: false
      - key: EMAILJS_STATUS_TEMPLATE_ID
        sync: false
